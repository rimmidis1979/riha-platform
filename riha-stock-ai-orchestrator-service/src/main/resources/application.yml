server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: riha-stock-ai-orchestrator-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/riha_stock_ai_db}
    username: ${SPRING_DATASOURCE_USERNAME:vchub_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vchub_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

riha:
  stockai:
    orchestrator:
      periodic-scan-interval-seconds: ${PERIODIC_SCAN_INTERVAL_SECONDS:15}
      robinhood-mcp-url: ${RIHA_ROBINHOOD_MCP_URL:http://localhost:8092}
      mcp-gateway-url: ${RIHA_MCP_GATEWAY_URL:http://localhost:8084}
      market-ingestor-url: ${RIHA_MARKET_INGESTOR_URL:http://localhost:8091}
      strategy-service-url: ${RIHA_STRATEGY_SERVICE_URL:http://localhost:8093}
      default-user-id: ${DEFAULT_USER_ID:ram-ai@rihasoftwaresolutions.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

