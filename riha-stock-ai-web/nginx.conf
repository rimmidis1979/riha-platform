server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Stock AI Strategy Service
    location /api/v1/stock-ai/ {
        proxy_pass http://riha-stock-ai-strategy-service:8093/api/v1/stock-ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    # Market Ingestor (Technicals, Screener, SEC)
    location /api/v1/market/ {
        proxy_pass http://riha-stock-ai-market-ingestor:8091/api/v1/market/;
        proxy_http_version 1.1;
    }

    # Robinhood Brokerage MCP Server
    location /api/v1/robinhood/ {
        proxy_pass http://riha-stock-ai-robinhood-mcp-server:8092/api/v1/robinhood/;
        proxy_http_version 1.1;
    }

    # MCP Gateway
    location /api/v1/mcp/ {
        proxy_pass http://riha-mcp-gateway:8084/api/v1/mcp/;
        proxy_http_version 1.1;
    }

    # Critic Engine
    location /api/v1/critic/ {
        proxy_pass http://riha-critic-engine:8085/api/v1/critic/;
        proxy_http_version 1.1;
    }

    # Memory Service
    location /api/v1/memory/ {
        proxy_pass http://riha-memory-service:8086/api/v1/memory/;
        proxy_http_version 1.1;
    }

    # Eval Monitor
    location /api/v1/eval/ {
        proxy_pass http://riha-eval-monitor:8087/api/v1/eval/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    # Version Control Hub (VCH)
    location /api/v1/goal-contracts {
        proxy_pass http://riha-version-control-hub:8080/api/v1/goal-contracts;
        proxy_http_version 1.1;
    }
    location /api/v1/prompt-versions {
        proxy_pass http://riha-version-control-hub:8080/api/v1/prompt-versions;
        proxy_http_version 1.1;
    }
    location /api/v1/topologies {
        proxy_pass http://riha-version-control-hub:8080/api/v1/topologies;
        proxy_http_version 1.1;
    }

    # Schema Validator
    location /api/v1/validator/ {
        proxy_pass http://riha-schema-validator:8080/api/v1/validator/;
        proxy_http_version 1.1;
    }
    location /api/v1/audits {
        proxy_pass http://riha-schema-validator:8080/api/v1/audits;
        proxy_http_version 1.1;
    }

    # Topology Orchestrator
    location /api/v1/orchestrator/ {
        proxy_pass http://riha-topology-orchestrator:8080/api/v1/orchestrator/;
        proxy_http_version 1.1;
    }
}
