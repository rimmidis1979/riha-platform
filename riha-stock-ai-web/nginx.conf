server {
    listen 80;
    server_name localhost;

    # Dynamic DNS resolver for AWS ECS Fargate & local docker
    resolver 169.254.169.253 172.31.0.2 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Upstream backend targets
    set $strategy_backend "http://riha-stock-ai-strategy-service.riha.internal:8093";
    set $market_backend "http://riha-stock-ai-market-ingestor.riha.internal:8091";
    set $robinhood_backend "http://riha-stock-ai-robinhood-mcp-server.riha.internal:8092";
    set $mcp_backend "http://riha-mcp-gateway.riha.internal:8084";
    set $critic_backend "http://riha-critic-engine.riha.internal:8085";
    set $memory_backend "http://riha-memory-service.riha.internal:8086";
    set $eval_backend "http://riha-eval-monitor.riha.internal:8087";
    set $vch_backend "http://riha-version-control-hub.riha.internal:8081";
    set $validator_backend "http://riha-schema-validator.riha.internal:8082";
    set $orchestrator_backend "http://riha-topology-orchestrator.riha.internal:8083";

    # Stock AI Strategy Service
    location /api/v1/stock-ai/ {
        proxy_pass $strategy_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    # Market Ingestor (Technicals, Screener, SEC)
    location /api/v1/market/ {
        proxy_pass $market_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Robinhood Brokerage MCP Server
    location /api/v1/robinhood/ {
        proxy_pass $robinhood_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # MCP Gateway
    location /api/v1/mcp/ {
        proxy_pass $mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Critic Engine
    location /api/v1/critic/ {
        proxy_pass $critic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Memory Service
    location /api/v1/memory/ {
        proxy_pass $memory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Eval Monitor
    location /api/v1/eval/ {
        proxy_pass $eval_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    # Version Control Hub (VCH)
    location /api/v1/goal-contracts {
        proxy_pass $vch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/prompt-versions {
        proxy_pass $vch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/topologies {
        proxy_pass $vch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Schema Validator
    location /api/v1/validator/ {
        proxy_pass $validator_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/audits {
        proxy_pass $validator_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Topology Orchestrator
    location /api/v1/orchestrator/ {
        proxy_pass $orchestrator_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
