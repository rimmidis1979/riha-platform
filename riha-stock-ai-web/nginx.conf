server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/stock-ai/ {
        proxy_pass http://riha-stock-ai-strategy-service:8093/api/v1/stock-ai/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/v1/orchestrator/ {
        proxy_pass http://riha-topology-orchestrator:8080/api/v1/orchestrator/;
        proxy_http_version 1.1;
    }

    location /api/v1/critic/ {
        proxy_pass http://riha-critic-engine:8085/api/v1/critic/;
        proxy_http_version 1.1;
    }
}

