      SPRING_DATASOURCE_USERNAME: vchub_user
      SPRING_DATASOURCE_PASSWORD: vchub_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_MCP_GATEWAY_URL: http://riha-mcp-gateway:8084
      APP_CRITIC_ENGINE_URL: http://riha-critic-engine:8085
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      riha-postgres:
        condition: service_healthy
      riha-kafka:
        condition: service_healthy
      riha-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      riha-network:
        aliases:
          - riha-eval-monitor

  # =====================================================================
  # INFRASTRUCTURE 8: riha-agentic-ai-hub (Port 5173 -> 80)
  # Registry: docker.io/rimmidis/riha-agentic-ai-platform
  # =====================================================================
  riha-agentic-ai-hub:
    image: docker.io/rimmidis/riha-agentic-ai-platform:riha-agentic-ai-hub
    build:
      context: ./agentic_ai_platform/web/riha-agentic-ai-hub
      dockerfile: Dockerfile
    container_name: riha-agentic-ai-hub
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      riha-version-control-hub:
        condition: service_healthy
      riha-schema-validator:
        condition: service_healthy
      riha-topology-orchestrator:
        condition: service_healthy
      riha-mcp-gateway:
        condition: service_healthy
      riha-critic-engine:
        condition: service_healthy
      riha-memory-service:
        condition: service_healthy
      riha-eval-monitor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - riha-network

  # =====================================================================
  # STOCK AI 1: riha-stock-ai-market-ingestor (Port 8091)
  # Registry: docker.io/rimmidis/riha-platform
  # =====================================================================
  riha-stock-ai-market-ingestor:
    image: docker.io/rimmidis/riha-platform:riha-stock-ai-market-ingestor
    build:
      context: ./stock-ai/riha-stock-ai-market-ingestor
      dockerfile: Dockerfile
    container_name: riha-stock-ai-market-ingestor
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: 8091
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RIHA_MARKET_WS_URL: ${RIHA_MARKET_WS_URL:-wss://stream.finance.yahoo.com}
      RIHA_MARKET_REST_URL: ${RIHA_MARKET_REST_URL:-https://query1.finance.yahoo.com/v8/finance/chart}
      RIHA_MARKET_API_KEY: ${RIHA_MARKET_API_KEY:-}
      RIHA_SEC_EDGAR_URL: ${RIHA_SEC_EDGAR_URL:-https://data.sec.gov}
      RIHA_SEC_USER_AGENT: ${RIHA_SEC_USER_AGENT:-RihaSoftwareSolutions-StockAI/1.0 (enterprise@rihasoftwaresolutions.com)}
      RIHA_MCP_GATEWAY_URL: http://riha-mcp-gateway:8084
    depends_on:
      riha-kafka:
        condition: service_healthy
      riha-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8091/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      riha-network:
        aliases:
          - riha-stock-ai-market-ingestor

  # =====================================================================
  # STOCK AI 2: riha-stock-ai-robinhood-mcp-server (Port 8092)
  # Registry: docker.io/rimmidis/riha-platform
  # =====================================================================
  riha-stock-ai-robinhood-mcp-server:
    image: docker.io/rimmidis/riha-platform:riha-stock-ai-robinhood-mcp-server
    build:
