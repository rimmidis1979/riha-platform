services:
  # =====================================================================
  # PostgreSQL 16: Multi-Tenant Relational & Vector Storage
  # Databases: vchub_archive, vch_db, solar_auditor_schema,
  #            solar_mcp_registry, solar_critic_db, solar_memory_db,
  #            solar_eval_db, riha_stock_ai_db
  # =====================================================================
  riha-postgres:
    image: postgres:16-alpine
    container_name: riha-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vchub_archive
      POSTGRES_USER: vchub_user
      POSTGRES_PASSWORD: vchub_secret
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./agentic_ai_platform/docker/postgres/init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vchub_user -d vchub_archive"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      riha-network:
        aliases:
          - postgres
          - riha-postgres

  # =====================================================================
  # Apache Kafka (KRaft mode): Asynchronous Event Choreography Backbone
  # =====================================================================
  riha-kafka:
    image: apache/kafka:latest
    container_name: riha-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "4L622nShTUiTvyT30rBQcw"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      riha-network:
        aliases:
          - kafka
          - riha-kafka

  # =====================================================================
  # Redis 7 Alpine: Orchestrator DAG State & Live Market Snapshots
  # =====================================================================
  riha-redis:
    image: redis:7-alpine
    container_name: riha-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      riha-network:
        aliases:
          - redis
          - riha-redis

  # =====================================================================
  # Jaeger: OpenTelemetry Distributed Tracing Backend & Visualizer
  # =====================================================================
  riha-jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: riha-jaeger
    hostname: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      riha-network:
        aliases:
          - jaeger
          - riha-jaeger

  # =====================================================================
  # INFRASTRUCTURE 1: riha-version-control-hub (Ports 8081 & 8089 -> 8080)
  # Registry: docker.io/rimmidis/riha-agentic-ai-platform
  # =====================================================================
  riha-version-control-hub:
    image: docker.io/rimmidis/riha-agentic-ai-platform:riha-version-control-hub
    build:
      context: ./agentic_ai_platform/riha-version-control-hub
      dockerfile: Dockerfile
    container_name: riha-version-control-hub
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "8089:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vchub_archive
      SPRING_DATASOURCE_USERNAME: vchub_user
      SPRING_DATASOURCE_PASSWORD: vchub_secret
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      APP_GIT_REPOSITORY_PATH: /app/data/git-repo
      SERVER_PORT: 8080
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus,env
      APP_GIT_REMOTE_URL: ${GITHUB_REPOSITORY_URL:-}
      APP_GIT_TOKEN: ${GITHUB_TOKEN:-}
      APP_GIT_USERNAME: ${GITHUB_USERNAME:-rimmidis1979}
    depends_on:
      riha-postgres:
        condition: service_healthy
      riha-kafka:
        condition: service_healthy
      riha-jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - git_repo_data:/app/data/git-repo
    networks:
      riha-network:
        aliases:
          - riha-version-control-hub
          - version-control-hub

  # =====================================================================
  # INFRASTRUCTURE 2: riha-schema-validator (Port 8082 -> 8080)
  # Registry: docker.io/rimmidis/riha-agentic-ai-platform
  # =====================================================================
  riha-schema-validator:
    image: docker.io/rimmidis/riha-agentic-ai-platform:riha-schema-validator
    build:
      context: ./agentic_ai_platform/riha-schema-validator
      dockerfile: Dockerfile
    container_name: riha-schema-validator
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vchub_archive
      SPRING_DATASOURCE_USERNAME: vchub_user
      SPRING_DATASOURCE_PASSWORD: vchub_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SERVER_PORT: 8080
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    depends_on:
      riha-postgres:
        condition: service_healthy
      riha-kafka:
        condition: service_healthy
      riha-jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      riha-network:
        aliases:
          - riha-schema-validator

  # =====================================================================
  # INFRASTRUCTURE 3: riha-topology-orchestrator (Port 8083 -> 8080)
  # Registry: docker.io/rimmidis/riha-agentic-ai-platform
  # =====================================================================
  riha-topology-orchestrator:
    image: docker.io/rimmidis/riha-agentic-ai-platform:riha-topology-orchestrator
    build:
      context: ./agentic_ai_platform/riha-topology-orchestrator
      dockerfile: Dockerfile
    container_name: riha-topology-orchestrator
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      APP_VCHUB_BASE_URL: http://riha-version-control-hub:8080
      SERVER_PORT: 8080
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    depends_on:
      riha-redis:
        condition: service_healthy
      riha-kafka:
        condition: service_healthy
      riha-jaeger:
        condition: service_started
      riha-version-control-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      riha-network:
        aliases:
          - riha-topology-orchestrator

  # =====================================================================
  # INFRASTRUCTURE 4: riha-mcp-gateway (Port 8084)
  # Registry: docker.io/rimmidis/riha-agentic-ai-platform
  # =====================================================================
  riha-mcp-gateway:
    image: docker.io/rimmidis/riha-agentic-ai-platform:riha-mcp-gateway
    build:
