      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      riha-network:
        aliases:
          - riha-critic-engine

  # =====================================================================
  # INFRASTRUCTURE 6: riha-memory-service (Port 8086)
  # Registry: docker.io/rimmidis/riha-agentic-ai-platform
  # =====================================================================
  riha-memory-service:
