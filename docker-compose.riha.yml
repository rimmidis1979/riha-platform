      retries: 10
      start_period: 25s
    networks:
      riha-network:
        aliases:
          - riha-memory-service

  # =====================================================================
  # INFRASTRUCTURE 7: riha-eval-monitor (Port 8087)
  # Registry: docker.io/rimmidis/riha-agentic-ai-platform
  # =====================================================================
  riha-eval-monitor:
    image: docker.io/rimmidis/riha-agentic-ai-platform:riha-eval-monitor
