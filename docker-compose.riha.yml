    ports:
      - "8092:8092"
    environment:
      SERVER_PORT: 8092
      ROBINHOOD_BASE_URL: ${ROBINHOOD_BASE_URL:-https://api.robinhood.com}
      ROBINHOOD_CLIENT_ID: ${ROBINHOOD_CLIENT_ID:-}
      ROBINHOOD_PRIVATE_KEY: ${ROBINHOOD_PRIVATE_KEY:-}
      RIHA_CRITIC_SIGNING_SECRET: ${RIHA_CRITIC_SIGNING_SECRET:-riha-enterprise-critic-hmac-key-2026}
      RIHA_MCP_GATEWAY_URL: http://riha-mcp-gateway:8084
    depends_on:
      riha-mcp-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8092/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      riha-network:
        aliases:
          - riha-stock-ai-robinhood-mcp-server

  # =====================================================================
  # STOCK AI 3: riha-stock-ai-strategy-service (Port 8093)
  # Registry: docker.io/rimmidis/riha-platform
  # =====================================================================
  riha-stock-ai-strategy-service:
    image: docker.io/rimmidis/riha-platform:riha-stock-ai-strategy-service
    build:
