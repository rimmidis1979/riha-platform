      RIHA_VALIDATOR_API_URL: http://riha-schema-validator:8080
      RIHA_ORCHESTRATOR_API_URL: http://riha-topology-orchestrator:8080
      RIHA_MCP_GATEWAY_API_URL: http://riha-mcp-gateway:8084
